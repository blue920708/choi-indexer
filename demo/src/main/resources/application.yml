spring:
    application:
        name: demo
    profiles:
        active: local

    jpa:
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect # mysql-connector-j와 서버 버전 조합에 따라 자동 감지가 깨져서 명시
                format_sql: true   # SQL을 보기 좋게 줄바꿈해서 출력
                use_sql_comments: true  # 어떤 메서드에서 나온 쿼리인지 주석으로 표시
