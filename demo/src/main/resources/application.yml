spring:
    application:
        name: demo
    profiles:
        active: local

    jpa:
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                format_sql: true   # SQL을 보기 좋게 줄바꿈해서 출력
                use_sql_comments: true  # 어떤 메서드에서 나온 쿼리인지 주석으로 표시
